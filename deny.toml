# cargo-deny configuration: `cargo deny check` (run in CI by the `deny` job).
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Vulnerabilities and yanked crates fail; unmaintained/unsound notices for transitive
# dependencies (mostly the GTK stack pulled in by Tauri on Linux) are reported only for
# crates in this workspace's direct dependency set.
yanked = "deny"
unmaintained = "workspace"
unsound = "workspace"
ignore = []

[licenses]
# Every license here is compatible with distributing STViewer under "MIT OR Apache-2.0".
# MPL-2.0 is file-level copyleft (cssparser/selectors/option-ext, used unmodified).
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
]
confidence-threshold = 0.9
# Some allowed licenses only occur on targets not in the current graph (e.g. ISC/libloading).
unused-allowed-license = "allow"

[licenses.private]
# Workspace crates are `publish = false`; check them against the allow-list anyway.
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
