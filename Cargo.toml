[workspace]
resolver = "2"
members = [
    "crates/mail-model",
    "crates/mapi-props",
    "crates/pst",
    "crates/mbox",
    "crates/msg",
    "crates/index",
    "crates/library",
    "crates/cli",
    "crates/mcp",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
# Highest `rust-version` among dependencies (hayro 0.9, the PDF thumbnail renderer).
rust-version = "1.92"
publish = false

# Clippy runs with its default groups only; CI denies warnings (`-D warnings`).
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.dependencies]
mail-model = { path = "crates/mail-model" }
mapi-props = { path = "crates/mapi-props" }
stv-pst = { path = "crates/pst" }
stv-mbox = { path = "crates/mbox" }
stv-msg = { path = "crates/msg" }
stv-index = { path = "crates/index" }
stv-library = { path = "crates/library" }
stv-mcp = { path = "crates/mcp" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
memmap2 = "0.9"
memchr = "2"
rayon = "1"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
encoding_rs = "0.8"
compressed-rtf = "1"
# mail-parser 1.x requires rustc 1.98, above the workspace rust-version.
mail-parser = "0.11"
tantivy = "0.27"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# Optimised build for local testing: no LTO, parallel codegen, incremental.
# Use `--profile release-fast`; keep `release` for shipped binaries.
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

[profile.dev.package."*"]
opt-level = 2
