[package]
name = "stv-index"
description = "Tantivy full-text index of messages and extracted attachment text for STViewer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
mail-model.workspace = true
mapi-props.workspace = true
tantivy.workspace = true
serde.workspace = true
serde_json.workspace = true
encoding_rs.workspace = true
html-escape = "0.3"
pdf-extract = "0.12"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.42"
# Measuring PDF streams before lopdf decodes them (same codecs lopdf uses).
flate2.workspace = true
weezl = "0.1"

[dev-dependencies]
tempfile = "3"
